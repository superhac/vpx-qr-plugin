[configuration]
id = "QR"
name = "QR Scanner"
description = "Reads QR/barcode scanners and publishes the scanned text to other plugins"
author = "superhac"
version = "0.5.0"
link = "https://github.com/superhac/vpx-qr-plugin"

[libraries]
windows.x86 = "plugin-qr.dll"
windows.x64 = "plugin-qr64.dll"
linux.x64 = "plugin-qr.so"
linux.aarch64 = "plugin-qr.so"
macos.x64 = "plugin-qr.dylib"
macos.arm64 = "plugin-qr.dylib"
