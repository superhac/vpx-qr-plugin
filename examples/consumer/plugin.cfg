[configuration]
id = "QRConsumer"
name = "QR Consumer (example)"
description = "Example plugin that receives scans from the QR plugin and shows them"
author = "superhac"
version = "0.1"
link = "https://example.com/qr"

[libraries]
windows.x86 = "plugin-qrconsumer.dll"
windows.x64 = "plugin-qrconsumer64.dll"
linux.x64 = "plugin-qrconsumer.so"
linux.aarch64 = "plugin-qrconsumer.so"
macos.x64 = "plugin-qrconsumer.dylib"
macos.arm64 = "plugin-qrconsumer.dylib"
